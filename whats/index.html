<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Abriendo WhatsApp… — AlgoLab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #3B0764 0%, #6D28D9 60%, #8B5CF6 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }
  .card { max-width: 360px; }
  .spinner {
    width: 46px; height: 46px; margin: 0 auto 1.25rem;
    border: 4px solid rgba(255,255,255,.25);
    border-top-color: #25D366;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.2rem; font-weight: 800; }
  p { opacity: .85; margin-top: .6rem; font-size: .92rem; line-height: 1.5; }
  a.manual {
    display: inline-block; margin-top: 1.5rem;
    background: #25D366; color: #fff; text-decoration: none;
    padding: .8rem 1.6rem; border-radius: 999px; font-weight: 700; font-size: .95rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Abriendo WhatsApp…</h1>
    <p>Si no se abre solo en unos segundos, toca el botón.</p>
    <a class="manual" id="manual-link"
       href="https://api.whatsapp.com/send/?phone=5218123895657&amp;text=Quiero%20aprovechar%20mi%20cup%C3%B3n%20de%20%241%2C450%20por%201%20semana&amp;type=phone_number&amp;app_absent=0">
      💬 Abrir WhatsApp
    </a>
  </div>

  <!-- Meta Pixel Code — dataset "AlgolabVerano" (2262112711227862) -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '2262112711227862');

  function metaGetCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
  }

  function sendMetaEvent(eventName) {
    const eventId = 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    fbq('track', eventName, {}, { eventID: eventId });
    fetch('/api/capi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        event_name: eventName,
        event_id: eventId,
        event_source_url: window.location.href,
        fbp: metaGetCookie('_fbp'),
        fbc: metaGetCookie('_fbc'),
        user_agent: navigator.userAgent,
      }),
      keepalive: true,
    }).catch(() => {});
  }
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=2262112711227862&ev=Lead&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->

  <script>
    // ══════════════ CONFIGURACIÓN — edita aquí ══════════════
    const WHATSAPP_NUMBER = '5218123895657';
    const DEFAULT_MESSAGE = 'Quiero aprovechar mi cupón de $1,450 por 1 semana';
    // ══════════════ FIN DE CONFIGURACIÓN ══════════════

    // Permite personalizar el mensaje por botón: /whats?msg=texto%20aquí
    const params = new URLSearchParams(window.location.search);
    const message = params.get('msg') || DEFAULT_MESSAGE;
    const waUrl = 'https://api.whatsapp.com/send/?phone=' + WHATSAPP_NUMBER +
      '&text=' + encodeURIComponent(message) + '&type=phone_number&app_absent=0';

    document.getElementById('manual-link').setAttribute('href', waUrl);

    // Esta carga de página ES el clic — se cuenta como Lead antes de mandar a WhatsApp
    sendMetaEvent('Lead');

    // Pequeño margen para que el pixel/CAPI alcancen a salir antes de navegar
    setTimeout(() => { window.location.href = waUrl; }, 600);
  </script>
</body>
</html>
